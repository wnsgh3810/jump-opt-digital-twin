name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install mkdocs mkdocs-material mkdocs-glightbox pymdown-extensions
      # 2026-08-17: 저장소 뿌리가 twin\ 에서 CVT\ 로 올라가면서
      # 문서 원본(mkdocs.yml)이 twin/ 아래로 내려갔다. 그래서 그 폴더에서 빌드한다.
      - name: Build
        run: mkdocs build --clean
        working-directory: twin
      # Programmatically enable Pages with "GitHub Actions" source (fixes deploy-pages 404)
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          # 위와 같은 이유로 결과물도 twin/ 아래에 생긴다.
          path: twin/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
